<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starvision</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #131c35;
      --text: #f4f7fb;
      --muted: #d7e0ee;
      --accent: #c28b2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(100%, 720px);
      text-align: center;
    }

    img {
      max-width: min(100%, 126px);
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.4rem, 2.8vw, 2.1rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.025rem);
      color: var(--muted);
    }

    strong {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Logo Starvision">
    <h1>Site em construção</h1>
    <p>Contato: <strong>21 98622-2710</strong></p>
  </main>
</body>
</html>
